name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for every job in this workflow: read-only
# access to repository contents (enough for checkout) and nothing else.
# Jobs that need more must opt in explicitly.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of running them in
# parallel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repo has two Go modules: the root module, and internal/glog (the JSON
# glog replacement the root go.mod points github.com/golang/glog at). `./...`
# from the root does not descend into nested modules, so every Go step below
# runs in both.
#
# The tpmkey and plugin tests run against go-tpm's TPM simulator, which is
# cgo-built ms-tpm-20-ref and links OpenSSL's libcrypto. Everything here is
# Linux-only (the plugin talks to /dev/tpmrm0), so there is no OS matrix.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes; don't leave the token in .git/config.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install simulator build dependencies
        run: sudo apt-get install -y --no-install-recommends libssl-dev
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          (cd internal/glog && go vet ./...)
      - name: go mod tidy check
        run: |
          go mod tidy -diff
          (cd internal/glog && go mod tidy -diff)

  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Control-plane nodes may be amd64 or arm64, and the TPM signature
        # handling is byte-level code worth running natively on both.
        include:
          - { go: stable, arch: amd64, runs-on: ubuntu-latest }
          - { go: stable, arch: arm64, runs-on: ubuntu-24.04-arm }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install simulator build dependencies
        run: sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Build
        run: go build ./...
      - name: Test
        run: |
          go test ./...
          (cd internal/glog && go test ./...)

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install simulator build dependencies
        run: sudo apt-get install -y --no-install-recommends libssl-dev
      # -race needs atomic covermode; both match how monetr collects coverage.
      - name: Test with coverage
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          (cd internal/glog && go test -race -covermode=atomic -coverprofile=coverage.out ./...)
      # always() so a failing test still publishes its coverage (the job still
      # fails -- the report just isn't lost with it).
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out,./internal/glog/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
